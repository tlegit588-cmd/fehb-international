  <title>São Tomé &amp; Príncipe: Emerald of the Equator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

      width: 6px;
      height: 6px;

    ::-webkit-scrollbar-track {

    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.7);
    }

    /* MapLibre Marker & Popup Overrides */
    .maplibregl-popup-content {
      background: rgba(2, 44, 34, 0.92) !important;
      backdrop-filter: blur(12px);
      color: #f8fafc !important;
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 1rem !important;
      padding: 12px 16px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
    }
    .maplibregl-popup-tip {
      border-top-color: rgba(2, 44, 34, 0.92) !important;
    }
    .maplibregl-ctrl-attrib {
      background: rgba(15, 23, 42, 0.6) !important;
      color: #94a3b8 !important;
      border-radius: 0.5rem 0 0 0;
    }
    .maplibregl-ctrl-attrib a {
      color: #34d399 !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Rich curated dataset for São Tomé & Príncipe
    const DESTINATIONS = [
      {
        id: 'pico-cao-grande',
        name: 'Pico Cão Grande',
        island: 'São Tomé',
        category: 'Landmark',
        coords: [6.5658, 0.1181],

        summary: 'A dramatic needle-shaped volcanic plug rising vertically out of the dense rainforest of Ôbo Natural Park.',

        image: 'https://placehold.co/800x500/064e3b/a7f3d0?text=Pico+Cao+Grande'
      },
      {

        elevation: '12 m',
        summary: 'The relaxed coastal capital featuring pastel-colored Portuguese colonial architecture, vibrant markets, and historic forts.',
        details: 'Founded in 1493, São Tomé is one of Africa’s smallest and safest capitals. Highlights include the 16th-century São Sebastião Fortress, the Presidential Palace, and the bustling Mercado Municipal.',
        highlights: ['São Sebastião Museum', 'Sé Catedral', 'Cacao & Coffee Cafés', 'Waterfront Promenade'],
        image: 'https://placehold.co/800x500/065f46/d1fae5?text=Sao+Tome+City'
      },
      {
        id: 'roca-sao-joao',
        name: 'Roça São João dos Angolares',
        island: 'São Tomé',
        category: 'Gastronomy & Heritage',
        coords: [6.6472, 0.1328],
        elevation: '65 m',
        summary: 'A historic cacao plantation transformed into a celebrated cultural hub and culinary destination.',
        details: 'Overlooking the Atlantic coast near Santa Cruz dos Angolares, this restored roça celebrates Angolar heritage, sustainable agriculture, local art galleries, and multi-course tasting menus crafted from island ingredients.',
        highlights: ['Chef João Carlos Silva', 'Angolar Culture', 'Organic Cacao Groves', 'Panoramic Ocean Views'],
        image: 'https://placehold.co/800x500/78350f/fef3c7?text=Roca+Sao+Joao'
      },
      {
        id: 'ilheu-das-rolas',
        name: 'Ilhéu das Rolas (Equator Line)',
        island: 'Ilhéu das Rolas',
        category: 'Geography & Beach',
        coords: [6.5236, 0.0000],
        elevation: '96 m',
        summary: 'A tranquil islet sitting directly on the Equator, allowing visitors to stand in both hemispheres simultaneously.',
        details: 'Accessible by a short boat ride from Ponta Baleia, Ilhéu das Rolas features the iconic Marco do Equador monument, volcanic blowholes (Furnas), and secluded golden beaches.',
        highlights: ['Zero Latitude Monument', 'Praia Café', 'Volcanic Blowholes', 'Snorkeling & Sea Turtles'],
        image: 'https://placehold.co/800x500/0f766e/ccfbf1?text=Ilheu+das+Rolas'
      },
      {
        id: 'principe-biosphere',
        name: 'Príncipe Island & Bay of Needles',
        island: 'Príncipe',
        category: 'UNESCO Biosphere',
        coords: [7.4178, 1.6139],
        elevation: '948 m',
        summary: 'The smaller, wilder sister island—an entire UNESCO Biosphere Reserve renowned for untouched rainforests and dramatic monoliths.',
        details: 'Known as "The Island of the Prince," Príncipe boasts extraordinary biodiversity, pristine bays like Praia Banana and Praia Boi, and low-impact eco-tourism initiatives.',
        highlights: ['UNESCO Biosphere Reserve', 'Praia Banana', 'Pico do Príncipe', 'Endemic Giant Sunbird'],
        image: 'https://placehold.co/800x500/14532d/bbf7d0?text=Principe+Biosphere'
      },
      {
        id: 'lagoa-azul',
        name: 'Lagoa Azul & Mucumbli',
        island: 'São Tomé',
        category: 'Nature & Coast',
        coords: [6.6114, 0.4061],
        elevation: '15 m',
        summary: 'A crystal-clear turquoise lagoon framed by ancient baobab trees and volcanic cliffs on the drier northern coast.',
        details: 'Located inside the northern tip of Ôbo Natural Park, Lagoa Azul offers the island’s best shore snorkeling amid coral gardens, colorful reef fish, and striking savanna-like coastal landscapes.',
        highlights: ['Turquoise Snorkeling Cove', 'Iconic Baobab Trees', 'Anambó Sea Stack', 'Historic Lighthouse'],
        image: 'https://placehold.co/800x500/0369a1/e0f2fe?text=Lagoa+Azul'
      }
    ];

    const KEY_STATS = [
      { label: 'Location', value: 'Gulf of Guinea (0°N)', sub: 'Equatorial Atlantic' },
      { label: 'Area', value: '1,001 km²', sub: '2nd Smallest in Africa' },
      { label: 'Philosophy', value: 'Leve-Leve', sub: 'Take it easy & live mindfully' },
      { label: 'Biodiversity', value: 'UNESCO Reserve', sub: 'High endemism ("African Galápagos")' }
    ];

    function App() {
      const [selectedId, setSelectedId] = useState(DESTINATIONS[0].id);
      const [filterIsland, setFilterIsland] = useState('All');
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [mapReady, setMapReady] = useState(false);
      const [mapError, setMapError] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});

      const selectedPlace = DESTINATIONS.find(d => d.id === selectedId) || DESTINATIONS[0];

      const filteredDestinations = filterIsland === 'All'
        ? DESTINATIONS
        : DESTINATIONS.filter(d => d.island.includes(filterIsland));

      // Trigger temporary notification banner (replaces alert)
      const showNotification = (message) => {
        setToastMsg(message);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Initialize MapLibre GL Map
      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        try {
          const map = new maplibregl.Map({
            container: mapContainerRef.current,
            style: {
              version: 8,
              sources: {
                'osm-tiles': {
                  type: 'raster',
                  tiles: [
                    'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
                    'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'
                  ],
                  tileSize: 256,
                  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
                }
              },
              layers: [
                {
                  id: 'simple-tiles',
                  type: 'raster',
                  source: 'osm-tiles',
                  minzoom: 0,
                  maxzoom: 19
                }
              ]
            },
            center: [6.85, 0.65], // Centered between São Tomé and Príncipe
            zoom: 7.4,
            pitch: 25
          });

          map.addControl(new maplibregl.NavigationControl(), 'top-right');

          map.on('load', () => {
            setMapReady(true);

            // Add Equator reference line
            map.addSource('equator-line', {
              type: 'geojson',
              data: {
                type: 'Feature',
                geometry: {
                  type: 'LineString',
                  coordinates: [
                    [5.5, 0.0],
                    [8.5, 0.0]
                  ]
                }
              }
            });

            map.addLayer({
              id: 'equator-layer',
              type: 'line',
              source: 'equator-line',
              paint: {
                'line-color': '#34d399',
                'line-width': 2,
                'line-dasharray': [4, 4],
                'line-opacity': 0.7
              }
            });

            // Add custom interactive markers
            DESTINATIONS.forEach((place) => {
              const el = document.createElement('button');
              el.className = 'group relative flex items-center justify-center w-8 h-8 rounded-full bg-emerald-500/90 border-2 border-white shadow-lg shadow-emerald-950/80 transition-transform duration-200 hover:scale-125 focus:outline-none cursor-pointer';
              el.setAttribute('aria-label', place.name);
              el.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-white"></span>`;

              el.addEventListener('click', () => {
                setSelectedId(place.id);
              });

              const marker = new maplibregl.Marker({ element: el })
                .setLngLat(place.coords)
                .addTo(map);

              markersRef.current[place.id] = { marker, el };
            });
          });

          map.on('error', (e) => {
            console.warn('Map warning:', e);
          });

          mapInstanceRef.current = map;
        } catch (err) {
          console.error('Failed to initialize map:', err);
          setMapError('Interactive map tiles could not be loaded offline. Use the location selector below.');
        }

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      // Fly to selected destination and highlight active marker
      useEffect(() => {
        if (!mapInstanceRef.current || !mapReady) return;

        Object.entries(markersRef.current).forEach(([id, { el }]) => {
          if (id === selectedId) {
            el.classList.remove('bg-emerald-500/90', 'scale-100');
            el.classList.add('bg-amber-400', 'scale-125', 'ring-4', 'ring-amber-400/40', 'z-20');
          } else {
            el.classList.remove('bg-amber-400', 'scale-125', 'ring-4', 'ring-amber-400/40', 'z-20');
            el.classList.add('bg-emerald-500/90', 'scale-100');
          }
        });

        mapInstanceRef.current.flyTo({
          center: selectedPlace.coords,
          zoom: 10.2,
          speed: 1.2,
          curve: 1.4,
          essential: true
        });
      }, [selectedId, mapReady]);

      // Reset map view to archipelago overview
      const handleResetView = () => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo({
            center: [6.85, 0.65],
            zoom: 7.4,
            pitch: 25,
            speed: 1.2
          });
        }
      };

      // Audio Guide via Web Speech API
      const toggleAudioGuide = () => {
        if (!('speechSynthesis' in window)) {
          showNotification('Audio narration is not supported in this browser.');
          return;
        }

        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(
          `${selectedPlace.name}, located on ${selectedPlace.island}. ${selectedPlace.summary} ${selectedPlace.details}`
        );
        utterance.rate = 0.96;
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      // Stop speech when switching places
      useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
        }
      }, [selectedId]);

      // Copy coordinates helper
      const handleCopyCoords = () => {
        const text = `${selectedPlace.name}: ${selectedPlace.coords[1].toFixed(4)}° N, ${selectedPlace.coords[0].toFixed(4)}° E`;
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showNotification(`Copied coordinates: ${text}`);
        } catch (err) {
          showNotification('Unable to copy coordinates.');
        }
        document.body.removeChild(textarea);
      };

      return (
        <div className="min-h-screen flex flex-col bg-gradient-to-b from-emerald-950 via-slate-950 to-slate-950">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-emerald-900/95 border border-emerald-400/40 text-emerald-50 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md text-sm font-medium flex items-center gap-2 transition-all">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
              {toastMsg}
            </div>
          )}

          {/* Header / Hero Banner */}
          <header className="border-b border-emerald-800/30 bg-emerald-950/60 backdrop-blur-xl sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-900/50 text-slate-950 font-bold text-lg">
                  0°
                </div>
                <div>
                  <span className="text-xs uppercase tracking-widest text-emerald-400 font-semibold block">
                    Interactive Archipelago Atlas
                  </span>
                  <h1 className="font-serif text-xl sm:text-2xl font-bold text-white tracking-tight">
                    São Tomé &amp; Príncipe
                  </h1>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <span className="px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-900/50 text-emerald-300 border border-emerald-700/40">
                  Emerald of the Equator
                </span>
                <button
                  onClick={handleResetView}
                  className="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-800/80 hover:bg-emerald-800/60 text-slate-200 border border-slate-700/60 transition cursor-pointer"
                >
                  Archipelago Overview
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Grid */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            {/* Key Archipelago Metrics */}
            <section className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
              {KEY_STATS.map((stat, idx) => (
                <div
                  key={idx}
                  className="bg-slate-900/70 border border-emerald-900/40 rounded-2xl p-4 backdrop-blur-sm hover:border-emerald-500/40 transition"
                >
                  <div className="text-xs font-medium text-emerald-400 uppercase tracking-wider">
                    {stat.label}
                  </div>
                  <div className="text-lg sm:text-xl font-bold text-white mt-1">
                    {stat.value}
                  </div>
                  <div className="text-xs text-slate-400 mt-0.5">
                    {stat.sub}
                  </div>
                </div>
              ))}
            </section>

            {/* Interactive Explorer Workspace */}
            <section className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* Left Column: Destination Directory */}
              <div className="lg:col-span-4 space-y-4">
                <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 shadow-xl">
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-300">
                      Explore Landmarks
                    </h2>
                    <div className="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                      {['All', 'São Tomé', 'Príncipe'].map((island) => (
                        <button
                          key={island}
                          onClick={() => setFilterIsland(island)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-medium transition cursor-pointer ${
                            filterIsland === island
                              ? 'bg-emerald-600 text-white shadow'
                              : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {island}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
                    {filteredDestinations.map((place) => {
                      const active = place.id === selectedId;
                      return (
                        <button
                          key={place.id}
                          onClick={() => setSelectedId(place.id)}
                          className={`w-full text-left p-3.5 rounded-2xl border transition-all cursor-pointer ${
                            active
                              ? 'bg-gradient-to-r from-emerald-900/70 to-teal-950/70 border-emerald-500/60 shadow-lg'
                              : 'bg-slate-950/60 border-slate-800/80 hover:border-slate-700 hover:bg-slate-900'
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-xs font-semibold text-emerald-400">
                              {place.island}
                            </span>
                            <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                              {place.category}
                            </span>
                          </div>
                          <h3 className="font-semibold text-base text-white mt-1">
                            {place.name}
                          </h3>
                          <p className="text-xs text-slate-400 line-clamp-2 mt-1">
                            {place.summary}
                          </p>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Center & Right Column: Map + Selected Detail Card */}
              <div className="lg:col-span-8 space-y-6">
                {/* Interactive Map Canvas */}
                <div className="relative rounded-3xl overflow-hidden border border-emerald-800/40 bg-slate-900 shadow-2xl h-[340px] sm:h-[400px]">
                  {mapError ? (
                    <div className="w-full h-full flex items-center justify-center p-6 text-center text-slate-400 text-sm">
                      {mapError}
                    </div>
                  ) : (
                    <div ref={mapContainerRef} className="w-full h-full" />
                  )}

                  {/* Map Legend Overlay */}
                  <div className="absolute bottom-3 left-3 bg-slate-950/85 backdrop-blur-md border border-slate-800 rounded-2xl px-3.5 py-2 text-xs text-slate-300 flex items-center gap-4 pointer-events-none">
                    <span className="flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>
                      Selected Site
                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-4 border-t-2 border-dashed border-emerald-400 inline-block"></span>
                      0°00' Equator
                    </span>
                  </div>
                </div>

                {/* Selected Destination Detail Panel */}
                <article className="bg-slate-900/90 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                  <div className="grid grid-cols-1 md:grid-cols-12">
                    <div className="md:col-span-5 relative min-h-[220px] bg-emerald-950">
                      <img
                        src={selectedPlace.image}
                        alt={selectedPlace.name}
                        onError={(e) => {
                          e.target.src = `https://placehold.co/800x500/064e3b/ecfdf5?text=${encodeURIComponent(selectedPlace.name)}`;
                        }}
                        className="w-full h-full object-cover"
                      />
                      <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold text-emerald-300 border border-emerald-500/30">
                        Elev. {selectedPlace.elevation}
                      </div>
                    </div>

                    <div className="md:col-span-7 p-6 flex flex-col justify-between space-y-4">
                      <div>
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="text-xs font-bold uppercase tracking-widest text-emerald-400">
                            {selectedPlace.island} • {selectedPlace.category}
                          </span>
                          <button
                            onClick={handleCopyCoords}
                            className="text-xs text-slate-400 hover:text-emerald-300 transition underline decoration-dotted cursor-pointer"
                            title="Copy GPS Coordinates"
                          >
                            {selectedPlace.coords[1].toFixed(4)}° N, {selectedPlace.coords[0].toFixed(4)}° E
                          </button>
                        </div>

                        <h2 className="font-serif text-2xl sm:text-3xl font-bold text-white mt-1">
                          {selectedPlace.name}
                        </h2>

                        <p className="text-sm text-emerald-100/90 font-medium mt-2 leading-relaxed">
                          {selectedPlace.summary}
                        </p>

                        <p className="text-sm text-slate-400 mt-2 leading-relaxed">
                          {selectedPlace.details}
                        </p>
                      </div>

                      <div className="space-y-4 pt-2 border-t border-slate-800/80">
                        <div className="flex flex-wrap gap-2">
                          {selectedPlace.highlights.map((tag, i) => (
                            <span
                              key={i}
                              className="px-3 py-1 rounded-xl text-xs font-medium bg-emerald-950/90 text-emerald-300 border border-emerald-800/50"
                            >
                              {tag}
                            </span>
                          ))}
                        </div>

                        <div className="flex items-center gap-3">
                          <button
                            onClick={toggleAudioGuide}
                            className={`px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition cursor-pointer ${
                              isSpeaking
                                ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20'
                                : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/40'
                            }`}
                          >
                            <span>{isSpeaking ? '⏹ Stop Audio Guide' : '🔊 Listen to Audio Guide'}</span>
                          </button>
                        </div>
