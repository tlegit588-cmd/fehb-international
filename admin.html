<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FEHB Admin | Sign In</title>
<style>
:root{--navy:#102b46;--navy2:#173b5c;--green:#18745d;--mint:#e8f3ee;--gold:#e7b95d;--ink:#1d2b38;--muted:#657789;--paper:#f7f9f8;--line:#e4ebe7;--white:#fff;--radius:22px;--red:#c0392b;--red-bg:#fdf0ee}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
a{color:var(--green);text-decoration:none;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 45px #102b4608;width:min(440px,100%);padding:40px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}
.brandmark{height:42px;width:42px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
.brandname{font-size:13px;font-weight:850;letter-spacing:.04em;color:var(--navy);line-height:1.25}
.brandname small{display:block;font-size:9px;letter-spacing:.17em;color:var(--green);margin-top:3px}
h1{font-size:22px;color:var(--navy);margin:0 0 6px;letter-spacing:-.02em}
.subtitle{color:var(--muted);font-size:13px;margin:0 0 24px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:11px;font-weight:850;color:var(--navy);letter-spacing:.03em}
.field input{width:100%;border:1px solid #dce6e0;border-radius:10px;padding:13px;background:#fff;font-size:14px;transition:.15s}
.field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px #18745d18}
.field input::placeholder{color:#aab8b2}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:999px;padding:14px;background:var(--green);color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:.2s;margin-top:4px}
.btn:hover{background:#105c49;transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.secondary{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
.btn.secondary:hover{background:var(--mint);transform:none}
.alert{border-radius:12px;padding:13px 16px;font-size:13px;font-weight:600;margin-bottom:18px;display:none}
.alert.show{display:block}
.alert.error{background:var(--red-bg);color:var(--red);border:1px solid #f0d5d0}
.alert.success{background:var(--mint);color:var(--green);border:1px solid #c5e7d7}
.toggle{text-align:center;margin-top:20px;font-size:12px;color:var(--muted)}
.toggle a{cursor:pointer}
.hidden{display:none}
/* Dashboard */
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.dash-user{display:flex;align-items:center;gap:12px}
.avatar{height:44px;width:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.dash-name{font-size:15px;font-weight:850;color:var(--navy)}
.dash-email{font-size:12px;color:var(--muted)}
.badge{display:inline-block;background:var(--mint);color:var(--green);font-size:10px;font-weight:900;padding:4px 10px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.dash-body{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
.dash-body h3{font-size:13px;color:var(--navy);margin:0 0 12px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.info-row:last-child{border-bottom:0}
.info-row span{color:var(--muted)}
.info-row strong{color:var(--navy)}
</style>
</head>
<body>

<!-- LOGIN CARD -->
<div id="loginCard" class="card">
  <div class="brand">
    <div class="brandmark">F</div>
    <div class="brandname">FEHB International<small>Admin Panel</small></div>
  </div>
  <h1>Sign In</h1>
  <p class="subtitle">Access the staff administration dashboard.</p>
  <div id="loginAlert" class="alert"></div>
  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" required placeholder="you@fehborganization.org">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••••••">
    </div>
    <button type="submit" class="btn" id="loginBtn">Sign In</button>
  </form>
  <div class="toggle">First-time setup? <a id="showBootstrap">Create admin account</a></div>
</div>

<!-- BOOTSTRAP CARD -->
<div id="bootstrapCard" class="card hidden">
  <div class="brand">
    <div class="brandmark">F</div>
    <div class="brandname">FEHB International<small>Admin Panel</small></div>
  </div>
  <h1>Initial Setup</h1>
  <p class="subtitle">Create the first super administrator account.</p>
  <div id="bootstrapAlert" class="alert"></div>
  <form id="bootstrapForm">
    <div class="field">
      <label for="bsSecret">Bootstrap Secret</label>
      <input id="bsSecret" type="password" required placeholder="Enter bootstrap secret">
    </div>
    <div class="field">
      <label for="bsName">Full Name</label>
      <input id="bsName" type="text" required placeholder="Jane Doe">
    </div>
    <div class="field">
      <label for="bsEmail">Email</label>
      <input id="bsEmail" type="email" required placeholder="you@fehborganization.org">
    </div>
    <div class="field">
      <label for="bsPassword">Password (12–128 characters)</label>
      <input id="bsPassword" type="password" required minlength="12" maxlength="128" placeholder="At least 12 characters">
    </div>
    <button type="submit" class="btn" id="bsBtn">Create Admin Account</button>
  </form>
  <div class="toggle">Already set up? <a id="showLogin">Sign in instead</a></div>
</div>

<!-- DASHBOARD CARD -->
<div id="dashCard" class="card hidden">
  <div class="dash-header">
    <div class="dash-user">
      <div class="avatar" id="dashAvatar"></div>
      <div>
        <div class="dash-name" id="dashName"></div>
        <div class="dash-email" id="dashEmail"></div>
      </div>
    </div>
    <span class="badge" id="dashRole"></span>
  </div>
  <div class="dash-body">
    <h3>Account Information</h3>
    <div class="info-row"><span>Name</span><strong id="infoName"></strong></div>
    <div class="info-row"><span>Email</span><strong id="infoEmail"></strong></div>
    <div class="info-row"><span>Role</span><strong id="infoRole"></strong></div>
    <div class="info-row"><span>Status</span><strong id="infoStatus"></strong></div>
  </div>
  <button class="btn secondary" id="logoutBtn">Sign Out</button>
</div>

<script>
const API = "/api";

function showAlert(el, msg, type) {
  el.textContent = msg;
  el.className = "alert show " + type;
}
function hideAlert(el) { el.className = "alert"; }
function setLoading(btn, loading, text) {
  btn.disabled = loading;
  btn.textContent = text;
}

// --- View switching ---
function showLogin() {
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("bootstrapCard").classList.add("hidden");
  document.getElementById("dashCard").classList.add("hidden");
}
function showBootstrap() {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("bootstrapCard").classList.remove("hidden");
  document.getElementById("dashCard").classList.add("hidden");
}
function showDashboard() {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("bootstrapCard").classList.add("hidden");
  document.getElementById("dashCard").classList.remove("hidden");
}

document.getElementById("showBootstrap").addEventListener("click", showBootstrap);
document.getElementById("showLogin").addEventListener("click", showLogin);

// --- Check session on load ---
async function checkSession() {
  try {
    const res = await fetch(API + "/auth/me", { credentials: "include" });
    if (res.ok) {
      const data = await res.json();
      if (data.success) renderDashboard(data.user);
    }
  } catch (e) { /* not logged in, stay on login */ }
}

function renderDashboard(user) {
  const name = user.full_name || user.name || "Admin";
  document.getElementById("dashAvatar").textContent = name.charAt(0).toUpperCase();
  document.getElementById("dashName").textContent = name;
  document.getElementById("dashEmail").textContent = user.email || "";
  document.getElementById("dashRole").textContent = (user.role || "admin").replace("_", " ");
  document.getElementById("infoName").textContent = name;
  document.getElementById("infoEmail").textContent = user.email || "";
  document.getElementById("infoRole").textContent = (user.role || "admin").replace("_", " ");
  document.getElementById("infoStatus").textContent = user.status || "active";
  showDashboard();
}

// --- Login ---
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById("loginAlert");
  const btn = document.getElementById("loginBtn");
  hideAlert(alertEl);
  setLoading(btn, true, "Signing in…");

  try {
    const res = await fetch(API + "/auth/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      renderDashboard(data.user);
    } else {
      showAlert(alertEl, data.error || "Login failed", "error");
    }
  } catch (err) {
    showAlert(alertEl, "Network error. Please try again.", "error");
  }
  setLoading(btn, false, "Sign In");
});

// --- Bootstrap ---
document.getElementById("bootstrapForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById("bootstrapAlert");
  const btn = document.getElementById("bsBtn");
  hideAlert(alertEl);
  setLoading(btn, true, "Creating…");

  try {
    const res = await fetch(API + "/auth/bootstrap", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        "X-Bootstrap-Secret": document.getElementById("bsSecret").value
      },
      body: JSON.stringify({
        name: document.getElementById("bsName").value,
        email: document.getElementById("bsEmail").value,
        password: document.getElementById("bsPassword").value
      })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      showAlert(alertEl, "Admin account created! Redirecting to login…", "success");
      setTimeout(() => {
        showLogin();
        hideAlert(alertEl);
      }, 2000);
    } else {
      showAlert(alertEl, data.error || "Setup failed", "error");
    }
  } catch (err) {
    showAlert(alertEl, "Network error. Please try again.", "error");
  }
  setLoading(btn, false, "Create Admin Account");
});

// --- Logout ---
document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await fetch(API + "/auth/logout", {
      method: "POST",
      credentials: "include"
    });
  } catch (e) { /* ignore */ }
  showLogin();
});

// --- Init ---
checkSession();
</script>
</body>
</html>
